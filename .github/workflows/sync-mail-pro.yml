name: Sincronizza posta pro@energyindex.pro

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# Una sola esecuzione alla volta: due in parallelo analizzerebbero (e
# pagherebbero) gli stessi messaggi due volte.
concurrency:
  group: sync-mail-pro
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Leggi, classifica e prepara le bozze
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MAIL_IMAP_USER: ${{ secrets.MAIL_IMAP_USER }}
          MAIL_IMAP_PASSWORD: ${{ secrets.MAIL_IMAP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npx tsx scripts/sync-mail-pro.ts
