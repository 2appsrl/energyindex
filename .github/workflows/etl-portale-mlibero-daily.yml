name: ETL Portale Offerte mercato libero (daily)

on:
  schedule:
    - cron: "15 5 * * *"   # 05:15 UTC — prima dello scraping brand (05:30)
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      # NB (14/10/2026): il portale risponde 403 a TUTTI gli IP dei runner
      # GitHub (verificato: anche il path CSV PLACET, con qualsiasi UA).
      # Questo cron fallira' finche' l'ETL non girera' da un IP italiano /
      # non-datacenter (self-hosted runner o cron su server proprio).
      - name: Sync Portale Offerte mercato libero
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/etl-portale-mlibero.ts
